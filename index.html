<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC TOE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h2>TIC TAC TOE</h2>
        <div class="players">
            <div class="player1">
                <h3>Player 1</h3>
                <p class="symbol">Symbol: X</p>
            </div>
            <div class="player2">
                <h3>Player 2</h3>
                <p class="symbol">Symbol: O</p>
            </div>
        </div>
        <div class="current_turn">
            <div class="color">

                <p>Current Turn: <span class="turn">Player 1</span></p>
            </div>
        </div>
        <div class="container">
            
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <div class="reset">
            <button class="reset_btn">Reset Game</button>
        </div>
    </main>


    <script src="script.js"></script>
</body>

</html>
